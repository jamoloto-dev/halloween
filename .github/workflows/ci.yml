name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint, Type Check & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check .

      - name: Run Mypy Type Checker
        run: |
          mypy

      - name: Run Pytest with Coverage
        run: |
          pytest -m "not e2e" --cov=halloween_quiz --cov-report=term-missing

  browser-e2e:
    name: Browser E2E Tests (Chromium, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev,e2e]"

      - name: Install Playwright Browser Binaries
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Browser E2E Tests
        run: |
          nohup python run.py > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/health | grep -q '"status":"ok"'; then
              echo "Server is healthy!"
              break
            fi
            sleep 1
          done
          pytest tests/test_browser_e2e.py tests/test_monetization_browser_e2e.py -m e2e -v
