version: "3.8"

services:
  halloween-quiz:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: halloween-quiz-app
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - DATABASE_PATH=/app/data/halloween.db
      - QUESTIONS_FILE=/app/assets/questions.json
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
