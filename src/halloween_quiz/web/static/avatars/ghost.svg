<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="ghost-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d4b8ff"/>
      <stop offset="100%" stop-color="#9d6bff"/>
    </radialGradient>
    <filter id="spectral-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#130e20" stroke="#a855f7" stroke-width="3"/>
  <!-- Ghost Silhouette with Spectral Wave -->
  <path d="M50 20 C32 20, 24 36, 24 56 C24 72, 28 84, 32 82 C36 80, 40 85, 44 82 C48 79, 52 85, 56 82 C60 79, 64 85, 68 82 C72 79, 76 82, 76 56 C76 36, 68 20, 50 20 Z" fill="url(#ghost-glow)" filter="url(#spectral-blur)"/>
  <!-- Ghostly Arms -->
  <path d="M26 52 C18 50, 16 56, 24 60" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M74 52 C82 50, 84 56, 76 60" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Cute Spooky Eyes -->
  <ellipse cx="42" cy="42" rx="4.5" ry="6.5" fill="#1b1226"/>
  <circle cx="40.5" cy="40" r="1.8" fill="#ffffff"/>
  <ellipse cx="58" cy="42" rx="4.5" ry="6.5" fill="#1b1226"/>
  <circle cx="56.5" cy="40" r="1.8" fill="#ffffff"/>
  <!-- O-shaped Spooky Mouth -->
  <ellipse cx="50" cy="53" rx="3.5" ry="5" fill="#1b1226"/>
  <!-- Rosy Spectral Cheeks -->
  <circle cx="36" cy="47" r="3.5" fill="#ff7186" opacity="0.4"/>
  <circle cx="64" cy="47" r="3.5" fill="#ff7186" opacity="0.4"/>
</svg>
