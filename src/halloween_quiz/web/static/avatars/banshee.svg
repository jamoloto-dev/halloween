<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="banshee-mist" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#81ecec"/>
      <stop offset="100%" stop-color="#0984e3"/>
    </radialGradient>
    <filter id="mist-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#061826" stroke="#00cec9" stroke-width="3"/>
  <!-- Wild Flowing Ethereal Hair / Spectral Vapor -->
  <path d="M50 18 C30 18, 14 36, 16 68 C14 80, 24 88, 30 78 C34 72, 38 88, 48 84 C56 88, 62 76, 68 84 C76 88, 86 78, 84 68 C86 36, 70 18, 50 18 Z" fill="url(#banshee-mist)" opacity="0.6" filter="url(#mist-blur)"/>
  <!-- Banshee Spirit Robes -->
  <path d="M34 52 C32 72, 28 84, 34 88 C40 82, 44 86, 50 82 C56 86, 60 82, 66 88 C72 84, 68 72, 66 52 Z" fill="#b2bec3" opacity="0.4"/>
  <!-- Pale Spectral Face -->
  <ellipse cx="50" cy="48" rx="14" ry="17" fill="#f5f6fa"/>
  <!-- Wild Forehead Tresses -->
  <path d="M36 44 C40 34, 46 32, 50 34 C54 32, 60 34, 64 44 C60 38, 56 38, 50 40 C44 38, 40 38, 36 44 Z" fill="#74b9ff"/>
  <!-- Eerie Sorrowful Eyes with Tears of Mist -->
  <ellipse cx="44" cy="46" rx="3.5" ry="4.5" fill="#0c2461"/>
  <circle cx="44" cy="46" r="1.8" fill="#00d2d3"/>
  <ellipse cx="56" cy="46" rx="3.5" ry="4.5" fill="#0c2461"/>
  <circle cx="56" cy="46" r="1.8" fill="#00d2d3"/>
  <!-- Spectral Mist Tears -->
  <path d="M44 51 Q43 56 42 60" stroke="#00d2d3" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M56 51 Q57 56 58 60" stroke="#00d2d3" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- Wailing / Shrieking Mouth -->
  <ellipse cx="50" cy="56" rx="4" ry="6" fill="#0c2461"/>
  <ellipse cx="50" cy="57" rx="2.5" ry="4" fill="#061826"/>
</svg>
